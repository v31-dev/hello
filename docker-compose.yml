services:
  # Redis for local development
  redis:
    image: redis:7.4.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly no
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
  
  # Backend for local development
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379
      - AUTH_URL=${AUTH_URL}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
      - NODE_ENV=development

  # Frontend for local development
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      - VITE_AUTH_URL=${AUTH_URL}
      - VITE_AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src

  # Nginx reverse proxy for local development
  nginx:
    image: nginx:alpine
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"