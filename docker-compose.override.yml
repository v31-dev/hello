services:
  backend:
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - node_modules/

  frontend:
    build:
      context: frontend
      target: development
    environment:
      - VITE_AUTH_URL=${AUTH_URL}
      - VITE_AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/

  nginx:
    ports:
      - 80:80